    document.querySelectorAll('a[href*="wa.me"], a[href*="api.whatsapp.com"]').forEach(a => {
      if (a._gclidPatched) return;
      a._gclidPatched = true;
      a.addEventListener('click', function() {
        a.href = appendGclidToWhatsAppUrl(a.href);
      }, true);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', patchAnchors);
  else patchAnchors();
  setTimeout(patchAnchors, 2000);
})();
</script>
